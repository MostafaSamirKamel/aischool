services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_school_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:${PORT:-8080}"
    environment:
      - APP_NAME="AI School"
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY:-base64:BZAGK0XVvoqnGNkkFs+t6N8kIieDYho6viEBsjonpu4=}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - APP_TIMEZONE=Africa/Cairo
      - APP_LOCALE=ar
      - PORT=${PORT:-8080}
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ai_school
      - DB_USERNAME=ai_school
      - DB_PASSWORD=secret
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS="info@aischool.test"
      - MAIL_FROM_NAME="AI School"
      - RUN_MIGRATIONS=true
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_school_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    environment:
      - APP_NAME="AI School"
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY:-base64:BZAGK0XVvoqnGNkkFs+t6N8kIieDYho6viEBsjonpu4=}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ai_school
      - DB_USERNAME=ai_school
      - DB_PASSWORD=secret
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - RUN_MIGRATIONS=false
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_school_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      - APP_NAME="AI School"
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY:-base64:BZAGK0XVvoqnGNkkFs+t6N8kIieDYho6viEBsjonpu4=}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ai_school
      - DB_USERNAME=ai_school
      - DB_PASSWORD=secret
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_MIGRATIONS=false
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: ai_school_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ai_school
      MYSQL_USER: ai_school
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_school_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ai_school_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATA_FILE: ""

  student-pwa:
    build:
      context: .
      dockerfile: AI_School_Student_Frontend/Dockerfile
    container_name: ai_school_student_pwa
    restart: unless-stopped
    ports:
      - "8081:8080"
    profiles:
      - frontend

volumes:
  app_storage:
    driver: local
  db_data:
    driver: local
  redis_data:
    driver: local
