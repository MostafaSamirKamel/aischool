name: CI / Production Readiness Checks

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Lint, Test & Asset Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Verify Code Style (Laravel Pint)
        run: vendor/bin/pint --test || echo "Pint formatting warnings detected"

      - name: Build Vite Production Assets
        run: npm run build

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Execute Automated Tests
        run: php artisan test

  docker-build-verification:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-school-web:ci-test

      - name: Build Standalone Student PWA Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./AI_School_Student_Frontend/Dockerfile
          push: false
          tags: ai-school-pwa:ci-test
